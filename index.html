  .patio-alerta .txt{grid-column:1/-1; font-size:14px; font-weight:400; line-height:1.35}

  .patio-tab{width:100%; border-collapse:collapse; font-size:13px}
  .patio-tab th{position:sticky; top:0; background:var(--surface); text-align:left; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:8px; border-bottom:1px solid var(--line)}
  .patio-tab td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top; cursor:pointer}
  .patio-grupo h3{padding:10px 12px 4px; font-size:10px; color:var(--muted)}
  .patio .patio-pessoa{display:grid; grid-template-columns:1fr auto; gap:2px 10px; width:100%; min-height:50px; text-align:left; text-transform:none;
    letter-spacing:0; border:0; border-bottom:1px solid var(--line); border-radius:0; background:none; padding:8px 12px; font-size:14px}
  .patio-pessoa span{font-size:12px; color:var(--muted); font-weight:400}
  .patio-pessoa small{grid-column:1/-1; font-size:12px; color:var(--muted); font-weight:400}

  .patio-det-topo{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line)}
  .patio-det-topo h2{font-size:24px; letter-spacing:.02em; line-height:1}
  .patio-det-topo h2.nome{text-transform:none}
  .patio-det-topo .sub{font-size:12px; color:var(--muted)}
  .patio-det-topo .patio-bt{margin-left:auto}
  .patio-chip{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface2); border:1px solid var(--line); white-space:nowrap}
  .patio-chip.solo{background:var(--blue); color:#fff} .patio-chip.descarga,.patio-chip.livre{background:var(--green); color:#fff}
  .patio-chip.chegando{background:var(--amber-dim)} .patio-chip.parado{background:var(--orange); color:#fff}
  .patio-chip.semsinal{background:var(--cinza); color:#fff} .patio-chip.viagem{background:var(--amber); color:#fff}
  /* minmax(0,1fr), nao 1fr: a coluna de conteudo tem que poder encolher
     ABAIXO do conteudo dela. Com 1fr puro, a lista de conexoes (nome de
     voo + bags + botao, todos sem quebra) empurrava o cartao inteiro e
     nascia uma barra de rolagem horizontal -- e a tela do patio nunca
     rola de lado. */
  .patio-linha{display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.45}
  .patio-linha .rot{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding-top:3px}
  /* Linha de LISTA: o rotulo sobe e o conteudo fica com a largura toda.
     Com as duas colunas de sempre sobravam ~230px pra nome de voo +
     bags + botao, e o nome saia cortado em "REC-…" -- justamente o dado
     que identifica a conexao. Label em cima custa uma linha e devolve
     110px pra cada uma das 9 conexoes. */
  .patio-linha.lista{display:block}
  .patio-linha.lista .rot{display:block; padding:0 0 4px}
  .patio-linha .ruim{color:var(--red); font-weight:700}
  .patio-grande{font-size:22px}
  .patio .patio-link{display:inline; min-height:0; padding:0; border:0; background:none; font-size:inherit; font-weight:700; text-transform:none; letter-spacing:0;
    text-decoration:underline; text-decoration-color:var(--amber-dim); text-underline-offset:3px}
  .patio-t{font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
  .patio-t.azul{color:var(--blue)} .patio-t.laranja{color:var(--orange)} .patio-t.ambar{color:var(--amber-mid)} .patio-t.verm{color:var(--red)} .patio-t.ok{color:var(--green)}
  /* Conexoes do Delta no detalhe do box: uma linha por conexao, com o
     unico botao que grava no Painel inteiro ("nao conecta", 17/09/2026).
     wrap porque no celular a linha tem 5 pedacos e nao cabe deitada --
     cortar com "..." aqui esconderia justamente a quantidade de bags,
     que e o numero que decide. */
  .patio-conexoes{display:flex; flex-direction:column}
  .patio-conexao{padding:7px 0; border-bottom:1px solid var(--line)}
  .patio-conexao:last-child{border-bottom:0}
  .cx-topo,.cx-baixo{display:flex; align-items:center; gap:8px; min-width:0}
  .cx-baixo{margin-top:1px; flex-wrap:wrap}
  /* nowrap: "REC-1560" quebrando em "REC-" / "1560" deixa de ser um
     numero de voo e vira duas palavras. Regra da skill ajuste-visual --

  .patio-conexao .quem{font-weight:700; font-size:15px; font-variant-numeric:tabular-nums;

  function togCarreta(vooId) {
    if (!UI.tri.carreta) UI.tri.carreta = [];
    const i = UI.tri.carreta.indexOf(vooId);
    if (i >= 0) UI.tri.carreta.splice(i, 1);
    else UI.tri.carreta.push(vooId);
    bus.render();

  function marcarTodaCarreta() {
    const todos = paradasAqui().map((b) => b.voo_destino_id);

    bus.render();

  async function sinalizarCarreta() {
    const sel = UI.tri.carreta || [];
    if (!sel.length) return;
    const ok = await confirmar(`Sinalizar a carreta com ${sel.length} voo${sel.length === 1 ? "" : "s"} na ${UI.tri.setor}?

    if (!ok) return;
    try {

      return;

    const origem = UI.tri.setor === "BOX" ? `no BOX ${esc(UI.tri.box)}` : `na ${UI.tri.setor}`;
