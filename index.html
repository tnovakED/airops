<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AIROPS-Modulo_Rampa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SUSE+Mono:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Paleta clara, trocada em 30/08/2026 (decisao do Tiago — ver
     docs/decisoes.md e .claude/skills/tela-de-patio/SKILL.md, secao
     "Cores", que e a fonte da verdade se isto precisar mudar nao vez.
     Fundo escuro foi testado e descartado: lavava no sol forte do
     patio. --amber e --blue MANTEM o nome antigo (o resto do app
     inteiro referencia esses dois tokens) mas agora apontam pra cores
     da paleta nova, nao mais dourado/azul vivo. */
  :root{
    --bg:#D9DCD6; --surface:#FFFFFF; --surface2:#EEF1EE; --line:rgba(22,66,91,.18);
    --amber:#2F6690; --amber-dim:#97B2C7;      /* baltic-blue — era o dourado de marca */
    --blue:#3A7CA5;                             /* cerulean — era o azul vivo informativo */
    --accent-light:#81C3D7;                     /* sky-blue-light — fundo de chip/aba selecionada */
    --amber-mid:#A67C1F;                        /* fora da paleta nova, de proposito — timer "hora de ir" */
    --green:#1F8A4C; --orange:#C15B1F; --red:#C23B3B; /* status escurecidos p/ nao lavar no fundo claro */
    /* verde-claro/amarelo sao NOVOS, de proposito diferentes de --green
       (ja significa "OK"/status concluido) e --amber-mid (dourado escuro,
       nao le como "amarelo" de bater o olho) — pousar/decolar precisa da
       propria identidade visual, sem emprestar significado de outro estado. */
    --verde-claro:#8BC34A; --amarelo:#F2C94C;
    /* 15/09/2026: verde pro numero pequeno sobre --accent-light (.deg-qtd).
       --green ali da 2.2:1 de contraste e some no sol; este da 5.3:1. */
    --verde-escuro:#0E4A28;
    /* 16/09/2026: fundo das duas linhas do mesmo aviao (duas pernas) no
       Ponto Delta. Roxo porque e o unico tom ainda sem significado no
       app; esmaecido porque o texto por cima continua --text. */
    --duas-pernas:rgba(123,63,166,.24);
    --text:#16425B; --muted:rgba(22,66,91,.62); /* yale-blue */
    --header-h:46px;
    --barra-h:52px;
  }
  /* Sem selecao de texto em lugar nenhum, de proposito (pedido do
     Tiago, 10/09): num app de toque, com luva, segurar o dedo um pouco
     mais pra arrastar (ver arrastarConexaoDelta, telaPontos.js) disparava
     a selecao/menu de "copiar" nativo do navegador no meio do gesto,
     competindo com o codigo e quebrando o arrasto. input/textarea saem
     da regra logo abaixo — digitar (numero de bag, nome de carreta,
     buscar em Acessos) continua precisando de cursor/selecao normal. */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; -webkit-touch-callout:none; user-select:none}
  input, textarea{-webkit-user-select:text; user-select:text}
  /* UMA fonte no app inteiro: SUSE Mono, herdada do body. As tres
     familias de antes (Barlow, Barlow Condensed, IBM Plex Mono) saem
     junto com as ~20 declaracoes espalhadas que as repetiam — o que
     nao herda por padrao (button, input, select) pede inherit logo
     abaixo. Mono em texto corrido ocupa mais largura: se alguma frase
     comecar a quebrar feio no celular, o lugar de mexer e aqui. */
  body{margin:0; background:var(--bg); color:var(--text); font-family:'SUSE Mono',monospace; font-size:16px}
  h1,h2,h3{text-transform:uppercase; letter-spacing:.06em; margin:0}
  .mono{font-family:'SUSE Mono',monospace}

  /* ---------- casca ---------- */
  /* Altura do header presa a --header-h (~a do botao Sair) — pedido
     do Tiago (27/08) pra sobrar tela pro conteudo no celular. .op-barra
     usa a MESMA variavel pra saber onde comecar o proprio sticky, por
     isso os dois tem que continuar lendo dela em vez de um px solto. */
  header.app{display:flex; align-items:center; gap:8px; padding:2px 14px; min-height:var(--header-h);
    background:var(--surface); border-bottom:2px solid var(--amber); position:sticky; top:0; z-index:10}
  header.app h1{font-size:14px; color:var(--amber)}
  header.app .who{margin-left:auto; text-align:right; line-height:1.1}
  header.app .who b{display:block; font-size:11px}
  header.app .who span{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  /* Abre o SideMenu (menuLateral.js) — botao icone dentro do proprio
     header, mesma familia visual do "Sair" (small ghost). */
  .menu-abrir{flex:0 0 auto; width:40px; min-height:40px; padding:0;
    background:transparent; border:none; display:inline-flex;
    align-items:center; justify-content:center; color:var(--text)}
  .fila-offline{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--amber);
    border-radius:20px; color:var(--amber); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  /* Ninguem mais reserva faixa fixa embaixo (o nav antigo, nav.tabs, foi
     substituido pelo SideMenu — que e overlay, nao ocupa espaco de
     layout) — um padding uniforme serve qualquer tela. */
  main{max-width:1024px; margin:0 auto; padding:14px 12px}

  /* ---------- board (assinatura FIDS) ---------- */
  .board-title{display:flex; align-items:baseline; gap:10px; margin:18px 0 8px}
  .board-title h2{font-size:17px; color:var(--muted)}
  .board-title:after{content:""; flex:1; height:1px; background:var(--line)}
  .flip{display:inline-block; background:#0d1526; border:1px solid var(--line); border-radius:6px;
    padding:2px 8px; color:var(--amber); font-weight:600; font-size:18px}

  /* ---------- cartoes / botoes ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px}
  button{font-family:inherit; text-transform:uppercase; letter-spacing:.06em;
    font-size:19px; font-weight:600; color:var(--text); background:var(--surface2);
    border:1px solid var(--line); border-radius:12px; min-height:56px; padding:8px 18px; cursor:pointer; width:100%}
  button:active{transform:scale(.985)}
  button.primary{background:var(--amber); color:#fff; border-color:var(--amber)}
  button.ok{background:var(--green); color:#fff; border-color:var(--green)}
  button.ghost{background:transparent}
  button.small{min-height:42px; font-size:16px; width:auto}
  button:disabled{opacity:.4; cursor:default}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row>*{flex:1}
  input,select{width:100%; min-height:52px; font-size:17px; color:var(--text);
    background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-family:inherit}
  label{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; display:block; margin:10px 0 4px}

  /* ---------- IDENTIFICACAO DE VOO (padrao do projeto) ----------
     YYY-XXXX-[BOX] · chegada --text (yale-blue) · saida --amber
     (baltic-blue, era dourado ate 30/08/2026).
     A cor vem do container (.voo-chegada / .voo-saida) e desce por
     currentColor, entao o numero, a placa do box e o icone mudam
     juntos — nao ha como uma tela pintar diferente da outra.

     Forma (modelo aprovado pelo Tiago em 21/08/2026): codigo em 24px
     peso 400, placa do box em quadrado de fundo --surface (branco) com
     borda 2px e canto 6px, com o numero a .92em. A placa so aparece
     onde ja aparecia — o rotulo NAO inventa box para quem nao tem.

     Este bloco e o unico lugar que estiliza numero de voo no projeto.
     Se aparecer um numero de voo com cara diferente em alguma tela, e
     porque a tela montou o rotulo na mao em vez de chamar vooRotulo(). */
  .voo{display:inline-flex; align-items:center; gap:6px; vertical-align:middle;
    font-size:24px; font-weight:400; line-height:1; white-space:nowrap}
  .voo-chegada{color:var(--text)}
  .voo-saida{color:var(--amber)}
  .voo-setor{color:var(--muted)}
  .voo-apt{font-size:.82em; letter-spacing:.06em; opacity:.75}
  /* 15/09/2026 (pedido do Tiago): sem hifen VISIVEL. Aeroporto e numero
     ficam colados e se separam pela cor/peso — aeroporto mais claro,
     numero em negrito. O "-" continua no HTML (voo.js), escondido so
     aqui: busca, copiar e os testes que leem "CGH-1409" seguem valendo.
     display:none tira o hifen do flex, e o margin-left negativo cancela
     o gap:6px que sobraria entre aeroporto e numero. Antes (28/08) o
     traco ficava visivel com margem -6px dos dois lados. */
  .voo-num{font-size:1em; font-weight:700}
  .voo-sep{display:none}
  .voo-sep + .voo-num{margin-left:-6px}

  /* a placa: quadrado de borda com o box no meio, herdando a cor */
  .voo-box{display:inline-flex; align-items:center; justify-content:center;
    min-width:1.9em; height:1.55em; padding:0 .3em; margin-left:1px;
    border:2px solid currentColor; border-radius:6px; background:var(--surface);
    font-size:.92em; letter-spacing:.02em; position:relative}
  /* selo de pouso/decolagem no CANTO da placa (mockup de referencia do
     Tiago, 01/09 — gemini-code-1788205900854.html, .icon-seal em
     .top-left/.top-right). Reverte o centralizado-em-cima de 31/08:
     aquela versao evitava cobrir o digito e invadir o numero do voo
     numa lista densa (ver docs/decisoes.md). Corner volta porque foi
     pedido explicitamente com o mockup na mao — se digito ou numero
     comecarem a sumir de novo, o problema documentado ali e esse. */
  .voo-corner{position:absolute; top:-8px;
    width:20px; height:20px;
    border-radius:50%; border:1.5px solid currentColor; background:var(--surface);
    display:flex; align-items:center; justify-content:center; pointer-events:none}
  .voo-corner.esq{left:-8px}
  .voo-corner.dir{right:-8px}
  /* cor do selo segue o TIPO do voo (pousando/decolando), nao o canto
     onde caiu (esq/dir e so posicao, ver aviaoApos em voo.js) — senao um
     selo de decolagem apareceria verde sempre que calhasse do lado
     esquerdo. Preto (currentColor) pinta a borda; o icone fica preto
     pela regra .voo-corner .ico-pousando/.ico-decolando, mais abaixo. */
  .voo-corner.pousando{background:var(--verde-claro); color:#000}
  .voo-corner.decolando{background:var(--amarelo); color:#000}
  /* pousando/decolando tem cor propria em QUALQUER lugar que apareçam —
     placa, selo da grade compacta de boxes, "ja decolou" — nao so aqui
     dentro da placa. Dentro de um circulo ja colorido (esta placa, o
     .bxq-corner da grade compacta) o icone tem que ficar PRETO por cima:
     verde-claro sobre fundo verde-claro sumiria. Por isso a regra mais
     especifica sobrescreve a de cima so nesses dois contextos. */
  .ico-pousando{color:var(--verde-claro)}
  .ico-decolando{color:var(--amarelo)}
  .voo-corner .ico-pousando, .voo-corner .ico-decolando,
  .bxq-corner .ico-pousando{color:#000}
  /* placa VERDE: ONDE a bag esta sendo largada (TCX/TLC). Na mesma
     linha convivem tres coisas — o box de onde ela saiu (branco, cor
     de chegada), o voo dela (ambar, cor de saida) e o destino da
     perna. A cor e o que separa as tres. */
  .voo-larga{color:var(--green)}
  /* perna ja entregue dentro do cartao da triagem: so o check. A hora
     nao aparece nesta tela — ela fica gravada, para a gestao. */
  .ok-verde{flex:0 0 auto; color:var(--green); display:inline-flex}
  .voo-hora{font-size:.8em; color:var(--muted); font-weight:500; margin-left:2px}
  .voo .ico{opacity:.7; flex:0 0 auto}

  /* tamanhos: p = dentro de linha corrida · g = titulo de cartao */
  .voo-p{font-size:15px}
  .voo-g{font-size:28px}
  .voo-par{display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap}
  .voo-seta{display:inline-flex; color:var(--muted); flex:0 0 auto}

  /* So destino + BOX na linha da viagem, sem origem (a origem ja aparece
     no popover ao confirmar entrega) — decisao do Tiago, 31/08 (revertendo
     a linha combinada origem->destino do mesmo dia, que continuava
     mostrando travessao de voo vazio). Tudo em negrito; o box fica maior
     que o resto, 15% acima do tamanho ORIGINAL do projeto (.92em de um
     .voo padrao de 24px = ~22px; 22*1.15 ~= 25.4px) — nao do tamanho que
     a linha combinada tinha usado antes. */
  .destino-viagem .voo{font-weight:700}
  .destino-viagem .voo-box{font-size:25.4px}

  /* Accordion do painel da viagem (cartaoVooDestino): a linha inteira
     toca pra abrir/fechar (de onde cada bag desse voo veio), o check
     tem stopPropagation no proprio onclick pra nao alternar junto.
     max-height, nao height, porque o conteudo tem tamanho variavel
     (1 a N origens) sem JS medindo nada. */
  .acordeon-cabeca{cursor:pointer}
  .acordeon-seta{display:inline-flex; color:var(--muted); transition:transform .16s ease}
  .acordeon-destino.aberto .acordeon-seta{transform:rotate(90deg)}
  .acordeon-corpo{max-height:0; overflow:hidden; opacity:0; transition:max-height .16s ease, opacity .16s ease}
  .acordeon-destino.aberto .acordeon-corpo{max-height:240px; opacity:1; margin-top:4px}
  @media (prefers-reduced-motion: reduce){
    .acordeon-seta, .acordeon-corpo{transition:none}
  }

  /* ---------- filtro de horario livre (inicio/fim) ---------- */
  .janela{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:0 0 12px}
  .janela-campo{display:flex; flex-direction:column; flex:0 0 auto}
  .janela-campo label{margin:0 0 4px}
  .janela-campo input{width:84px; min-height:44px; font-size:16px;
    text-align:center; padding:6px 4px}

  /* estado da descarga no box: a cor da borda diz sem precisar ler */
  .bx-estado{text-transform:uppercase;
    letter-spacing:.06em; font-size:12px; color:var(--muted); margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:4px}
  .voo-btn.bx-chegando{border-color:var(--amber-dim)}
  .voo-btn.bx-chegando .bx-estado{color:var(--amber)}
  .voo-btn.bx-descarregando{border-color:var(--blue)}
  .voo-btn.bx-descarregando .bx-estado{color:var(--blue)}
  .voo-btn.bx-ok{opacity:.62}
  .voo-btn.bx-ok .bx-estado{color:var(--green)}

  /* Voo que ja decolou e ainda tem bag no chao. Acontece com
     frequencia na operacao, entao NAO e alarme vermelho: seria
     ruido constante e o operador aprenderia a ignorar. --amarelo (a
     mesma cor do icone de decolagem ao lado, ver .ico-decolando) e o
     peso certo — "repare nisto", sem alarmar. */
  .voo-partiu{color:var(--amarelo); display:inline-flex; align-items:center; gap:4px}

  /* ---------- alerta de serviço solicitado ----------
     Cada demanda aparece direto na lista, com o proprio Aceitar do
     lado — decisao do Tiago (26/08): aceitar uma bag ja e pega-la, sem
     passo de abrir o lugar e marcar o que coube depois de chegar. */
  .card.alerta{border-color:var(--orange)}

  /* O LUGAR e o dado lido de relance, de luva e sob sol. Encolhe com
     a largura em vez de quebrar: "BOX" partido no meio nao e endereco.
     Fica fixo a direita (pedido do Tiago, 28/08) — as abas de secao
     (.deg-linha, quando existem) ocupam o espaco a esquerda e quebram
     linha sozinhas conforme crescem, sem empurrar o LUGAR pra baixo. */
  .lugar-linha{display:flex; align-items:flex-start; gap:10px; padding:0 0 2px}
  /* Espacamento minimo, so aqui (pedido do Tiago, 31/08): o card BOX tem
     6 secoes conhecidas e as abas quebravam em 3 linhas. Nao mexe no
     .deg-linha/.deg base — esses continuam servindo a trilha da folha
     (ONDE ESTOU/QUAIS DESTINOS), que nao tem esse problema de espaco.
     Altura do alvo de toque (min-height) nao muda — so a largura. */
  .lugar-linha .deg-linha{flex:1 1 auto; margin-top:0; gap:3px}
  .lugar-linha .deg-linha .deg{padding:0 8px}
  /* 15/09/2026: espacamento entre letras 0.1px em tudo que fica na
     cabeca-do-cartao (abas de secao e o LUGAR) — pedido do Tiago, que
     leu 0.9px no modo pecas. Em px, nao em em: ele pediu o numero. */
  .lugar-linha .deg, .lugar-linha .lugar{letter-spacing:.1px}
  /* 15/09/2026: espacamento entre letras -1px no rotulo de voo, so
     dentro dos cartoes de alerta (BOX/TCX/TLC). O .voo das outras telas
     nao muda. .voo-apt e .voo-box tem letter-spacing proprio e nao
     herdam isto — so o numero do voo e o hifen encolhem. */
  .card.alerta .voo{letter-spacing:-1px}
  /* A propria palavra e o gatilho de arrastar (pedido do Tiago, 31/08 —
     antes era um botao de alca dedicado, tirado pra sobrar espaco pras
     abas de secao). touch-action:none so aqui, igual a alca tinha: o
     resto do cartao continua rolando a pagina normal, e as abas ao lado
     (mesmo flex .lugar-linha) nao ganham isto, senao o toque nelas
     estragava. Margem negativa encosta o texto no canto superior direito
     do card — o .card pai tem padding:14px, sem isto sempre sobrava esse
     tanto ate a borda. */
  .lugar{font-size:clamp(34px,10.5vw,44px); font-weight:600; line-height:.95;
    letter-spacing:.02em; color:var(--text); flex:0 0 auto;
    touch-action:none; cursor:grab; margin-top:-8px; margin-right:-8px}

  /* Agrupa o sino de urgencia do cartao com o LUGAR (que e o gatilho de
     arrastar) sem entrar dentro dele — o margin-left:auto que empurrava
     so o LUGAR pra direita mudou pra ca, pro grupo inteiro ir junto. */
  .lugar-grupo{display:flex; align-items:center; gap:8px; margin-left:auto}

  /* Sino de urgencia do CARTAO (soma todos os sublugares, nao so a aba
     ativa) — mesmo padrao visual do selo por lugar (.alerta-urgentes),
     so que no cabecalho. So existe quando ha timer vermelho no cartao,
     entao a propria presenca ja e o alarme; o balanco (like o sino do
     Material Symbols) reforca sem precisar de vermelho piscando tambem. */
  .card-urgentes{display:flex; align-items:center; gap:4px; color:var(--red); font-weight:700}
  .card-urgentes .ico{transform-origin:50% 15%; animation:sinoBalanca 1s cubic-bezier(.455,.03,.515,.955) infinite}
  @media (prefers-reduced-motion: reduce){ .card-urgentes .ico{animation:none} }

  /* Os cartoes deslizam (translateY, aplicado via JS em
     arrastarCartaoAlerta) para abrir espaco conforme o arrastado passa
     por cima — .arrastando tira a transicao do proprio cartao segurado,
     que tem que seguir o dedo sem atraso. */
  .alertas-lista .card.alerta{transition:transform .18s ease}
  .alertas-lista .card.alerta.arrastando{transition:none; z-index:5;
    box-shadow:0 4px 14px rgba(22,66,91,.35)}
  @media (prefers-reduced-motion: reduce){
    .alertas-lista .card.alerta{transition:none}
  }

  /* Lista sempre visivel, uma linha por demanda com o Aceitar do lado
     (list-line ja da o layout — grow+botao). Rola depois de umas
     poucas linhas pra o cartao nao crescer sem fim quando um lugar
     tem muita bag esperando. Colada no cabecalho, sem respiro extra. */
  /* 16/09/2026: 220 -> 360. Com a carreta aberta (accordion + botao
     PEGAR) 220px cortava a acao, e o operador tinha que rolar DENTRO do
     cartao pra achar o botao. 360 cabe cabecalho + 4 voos + botao, que
     e a carreta tipica. Continua limitado: o motivo original do teto --
     o cartao nao crescer sem fim num lugar com muita bag -- nao mudou. */
  .alerta-lista{border-top:1px solid var(--line); margin:0; padding-top:2px;
    max-height:360px; overflow-y:auto}
  .alerta-linha button{flex:0 0 auto}

  /* Botao de acao da linha (Aceitar/Cancelar/Ver voos) so-icone, quadrado —
     52px folga acima do minimo de alvo de toque dentro de alerta (pedido
     do Tiago, 28/08: maior e quadrado, no padrao dos outros botoes do
     app — border-radius:12px, ver "button" acima). A cor vem de
     .primary/.ok/.ghost (ja existentes), aqui so forma e tamanho. Zera o
     margin-right que "button .ico" da pra icone+texto — aqui o icone e
     sozinho, centralizado. */
  /* 15/09/2026: 34x34 com icone 34x34, medidas pedidas pelo Tiago no
     modo pecas (era 52x52 com icone de 20). O ::after estica a area de
     TOQUE, invisivel: o botao se ve com 34, mas o dedo de luva acerta em
     37x40 (skill ajuste-visual). Pra DIREITA nao estica: o ultimo botao
     encosta na borda da .alerta-lista, que rola (overflow-y:auto), e 3px
     pra fora dela viravam barra de rolagem horizontal (visto no print).
     O icone nao encolhe (flex:none): sem isso a borda de 1px do botao
     apertava ele pra 32 de largura. */
  .alerta-acao{flex:0 0 auto; width:34px; height:34px; min-height:34px; padding:0;
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    position:relative}
  .alerta-acao::after{content:""; position:absolute; top:-3px; bottom:-3px; left:-3px; right:0}
  .alerta-acao .ico{margin-right:0; width:34px; height:34px; flex:none}

  /* ---------- accordion de carretas dentro do olho (16/09/2026) ----------
     O card BOX saiu de 6 toques pra 4: tocar na carreta ABRE (nao aceita
     mais), e o PEGAR aceita e leva no mesmo ato. Ver carretasDoAlerta em
     telaOperador.js.
     Cabeca em maiuscula e seta, mesmo idioma do accordion da viagem
     (.acordeon-destino) — quem ja usa o app reconhece que abre. */
  .carreta-alerta{cursor:pointer; gap:8px; text-transform:uppercase;
    font-size:13px; font-weight:700; color:var(--muted)}
  .carreta-alerta.aberta{color:var(--text)}
  .carreta-alerta .acordeon-seta{flex:0 0 auto; transition:transform .15s}
  .carreta-alerta.aberta .acordeon-seta{transform:rotate(90deg)}
  /* Voo dentro da carreta aberta: recuado, pra ler como "filho" da
     carreta e nao como mais uma carreta. Marcado usa o mesmo azul-claro
     de selecionado do resto do app. */
  .alerta-voo{cursor:pointer; padding-left:16px; gap:8px; border-radius:10px}
  .alerta-voo.sel{background:var(--accent-light)}
  /* Botao largo e no fim da carreta aberta: e a acao que termina o
     passo, e alvo de dedo de luva (48px, acima do minimo).
     Ja foi sticky (bottom:0) pra nao cair fora da area que rola. Durou
     uma versao: com uma linha DEPOIS da carreta aberta (uma bag
     misturada, por exemplo), o botao grudado no pe passava por cima
     dela -- parecia defeito. A altura da .alerta-lista subiu no lugar
     disso (16/09/2026). */
  .alerta-pegar{width:100%; margin:8px 0 4px; min-height:48px;
    text-transform:uppercase; letter-spacing:.04em}
  @media (prefers-reduced-motion: reduce){
    .carreta-alerta .acordeon-seta{transition:none}
  }

  /* Contagem de VOOS (nao bags) do lugar — sempre visivel, tom neutro:
     e contexto, nao alarme. Convive com .alerta-urgentes (so aparece
     com timer vermelho) sem competir por atencao. */
  .alerta-contagem{display:flex; align-items:center; gap:4px;
    color:var(--muted); font-weight:600; font-size:.85em}

  /* Contagem de urgentes DA LINHA (um lugar pode ter varios voos
     pendentes; quantos deles estao em timer-vermelho). */
  .alerta-urgentes{display:flex; align-items:center; gap:4px;
    color:var(--red); font-weight:600; font-size:.85em}

  /* ---------- icones (Phosphor + Material Symbols) ---------- */
  .ico{display:inline-block; vertical-align:-.15em}
  button .ico{vertical-align:-.18em; margin-right:6px}

  /* Log do Ponto Delta/Indice por linha (Subir Pontos): so aparece se
     aquele voo teve algo no log da ultima importacao. Toque (nao hover)
     abre o texto — celular no patio nao tem mouse pra tooltip. */
  .log-ponto{display:inline-flex; flex:0 0 auto; color:var(--amber); cursor:pointer;
    vertical-align:-.15em; margin:0 4px}

  /* Mesma vaga do .log-ponto, mas enquanto o arquivo DAQUELA linha ainda
     esta sendo lido/gravado (importarPontos, telaPontos.js) — nao e
     clicavel, entao sem cursor:pointer, e a cor muda pra nao confundir
     com "tem log pra ver". */
  .log-carregando{display:inline-flex; flex:0 0 auto; color:var(--blue);
    vertical-align:-.15em; margin:0 4px}
  .log-carregando .ico{animation:girar 1s linear infinite}
  @media (prefers-reduced-motion: reduce){ .log-carregando .ico{animation:none} }

  /* Selo PERSISTENTE de "arquivo lido" (sql/atualizacao_45.sql). Ao
     contrario do .log-ponto, que e o recado da importacao que ACABOU de
     rodar na aba de quem clicou, este vem do banco: sobrevive ao F5 e
     aparece igual pra qualquer pessoa que abrir a tela.
     Tres estados, e o do meio e o que nao existia:
       .ok    verde  — lido, com N conexoes
       .vazio azul   — lido, ZERO conexoes (nao e falta de importacao)
       .sem   cinza  — arquivo nunca subiu */
  .ponto-selo{display:inline-flex; align-items:center; gap:2px; flex:0 0 auto;
    vertical-align:-.15em; margin:0 4px; font-size:11px; font-weight:700;
    font-variant-numeric:tabular-nums}
  .ponto-selo i{font-style:normal}
  .ponto-selo.ok{color:var(--green)}
  .ponto-selo.vazio{color:var(--blue)}
  .ponto-selo.sem{color:var(--muted)}

  /* ---------- chips de status ---------- */
  .chip{display:inline-block; text-transform:uppercase; letter-spacing:.07em;
    font-size:14px; font-weight:600; border-radius:999px; padding:3px 12px}
  .st-a_caminho{background:rgba(58,124,165,.15); color:var(--blue)}
  .st-entregue,.st-concluida{background:rgba(31,138,76,.15); color:var(--green)}
  .st-solicitada{background:rgba(193,91,31,.18); color:var(--orange)}
  .st-aceita{background:rgba(47,102,144,.15); color:var(--amber)}
  .st-cancelada{background:rgba(194,59,59,.14); color:var(--red)}
  /* Bag que fica em Brasília: vai pra esteira, não embarca. Usa --text
     (a cor de CHEGADA) de propósito — a linha dela é a ponta de chegada
     da rotação, e o chip repete essa leitura em vez de brigar com ela. */
  .st-base{background:rgba(22,66,91,.12); color:var(--text)}
  /* Chip que E botao (aviso de PP, 18/09/2026): parece chip, age como
     botao. Zera o que o button traz de fabrica (altura de 56px, largura
     total, maiuscula) pra caber na linha nowrap do Delta, e devolve o
     alvo de toque por padding, nao por altura -- a linha inteira tem
     42px e um botao de 56 a esticaria. */
  button.chip-botao{min-height:0; width:auto; padding:3px 8px; border:0;
    font-size:11px; letter-spacing:0; text-transform:none; cursor:pointer; flex:none;
    position:relative}
  /* O chip tem 16px de altura visivel -- longe dos 40px que mao de luva
     no sol precisa. Este bloco estica a AREA DE TOQUE pra 40px sem
     engordar o chip: se engordasse, a linha do Delta (42px, nowrap)
     cresceria e o numero do voo perderia espaco. Ver a regra de alvo de
     toque na skill tela-de-patio. */
  button.chip-botao::after{content:""; position:absolute; left:0; right:0;
    top:50%; transform:translateY(-50%); height:40px}

  /* ---------- cabeca da carreta na folha (16/09/2026) ----------
     O lider monta a carreta no Ponto Delta e ela aparece aqui agrupando
     os voos. Mesma caixa grande e mesma linha-alvo do "Marcar todas"
     (.list-line) porque faz a mesma coisa: marca um conjunto de uma vez.
     O que muda e o nome, que e do lider.
     Sem letter-spacing: o "· 2 voos" e contagem, e contagem no projeto
     nao leva espacamento (ver skill ajuste-visual). O respiro de 12px em
     cima e o que separa uma carreta da lista da carreta anterior — sem
     ele, duas carretas viram um bloco so de linhas. */
  /* Cor por carreta, igual a tela do lider (pedido do Tiago, 17/09/2026).
     Desde 18/09/2026 o --matiz mora no .balde-cor que embrulha cabecalho
     E voos (mesma peca do Ponto Delta), nao mais so na linha do
     cabecalho: ele pediu "deixe tudo com a cor do cabeçalho". Por isso
     .carreta-folha nao carrega mais borda nem fundo proprios -- se
     carregasse, a faixa sairia dobrada. Nao briga com .marcada: sao dois
     canais diferentes -- a cor diz QUAL carreta, o check ambar diz
     SELECIONADA. */
  .carreta-folha{margin-top:0}
  .balde-cor{margin-top:12px}
  .destino-lista + .balde-cor{margin-top:14px}
  /* Alvo de toque proprio: a caixa marca a carreta inteira e o nome abre
     o accordion. Sao dois toques diferentes na mesma linha, entao a
     caixa precisa dos 44px dela pra nao roubar o toque do nome (luva,
     sol, pressa). */
  .carreta-folha-check{flex:0 0 auto; color:var(--muted); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    min-width:44px; min-height:44px; margin-left:-10px}
  .carreta-folha.marcada .carreta-folha-check{color:var(--amber)}
  .carreta-folha-alterna{min-width:0; display:flex; align-items:center; gap:6px; cursor:pointer}
  .carreta-folha-nome{padding-left:0; text-transform:uppercase; font-size:13px;
    font-weight:700; color:var(--muted)}
  .carreta-folha.marcada .carreta-folha-nome{color:var(--text)}
  /* "· 1 fora da malha" (16/09/2026): o lider pos mais voos nesta carreta
     do que o app consegue oferecer, porque a malha do dia nao tem esses
     voos. Laranja (nao o ambar do tema, que aqui e azul): e falta de
     dado, nao urgencia. Fica visivel mesmo na carreta ainda nao marcada,
     por isso NAO herda o cinza do nome. */
  /* LINHA PROPRIA, nao pedaço colado no fim do nome: com nome longo +
     "(1 de 2)" + o aviso, a linha quebrava em lugar imprevisivel e o
     aviso aparecia partido ao meio (visto na vitrine, 16/09/2026).
     Bloco proprio = layout igual sempre. */
  .carreta-folha-fora{display:block; color:var(--orange); font-weight:700; margin-top:2px}
  /* Quantidade de bags + veiculo na pronta que nasceu com numero (a "bag
     de outro voo", 18/09/2026). Linha propria: com nome de voo + selos +
     timer, colada no fim ela quebrava em lugar imprevisivel. */
  .pronta-qtd{display:block; font-size:12px; font-weight:700; color:var(--blue); margin-top:2px}

  /* BAG MISTURADA (16/09/2026): a bag foi chamada sozinha, mas continua
     no meio de uma carreta montada — quem for buscar vai ter que
     separar. Laranja, igual ao "fora da malha": as duas sao informacao
     que muda o que fazer, nao urgencia de relogio. Recuada pra ficar
     claro que fala da linha de cima, nao da proxima. */
  .bag-misturada{display:inline-block; color:var(--orange); font-weight:700;
    font-size:12px; letter-spacing:.06em; margin:0 0 4px 16px}
  /* Decolagem iminente: o voo sai em SINO_IMINENTE_MIN minutos ou menos.
     Fica em cima do VOO; o timer colorido ao lado continua falando do
     tempo. Vermelho porque aqui nao ha o que decidir — ou vai agora, ou
     nao vai. */
  .sino-iminente{display:inline-flex; align-items:center; color:var(--red);
    font-weight:700; font-size:12px; letter-spacing:.04em}
  .sino-iminente .ico{width:16px; height:16px; margin-right:0}

  /* ---------- lista de destinos (folha do Operador) ----------
     15/09/2026, pedido do Tiago: voos de saida um embaixo do outro, sem
     cara de botao (era a .voo-grid logo abaixo) e sem quadradinho.
     Marcado = fundo --accent-light, o mesmo "selecionado" do resto do
     app, sem borda nem sombra. Bags e hora vem colados na placa (gap
     12px: o selo amarelo sai 8px pra direita da placa e nao pode cobrir
     o numero). padding 10px em cima deixa lugar pro selo, que sobe 8px. */
  .destino-lista{margin-top:10px}
  /* .pt-linha.destino-linha, nao so .destino-linha: a regra .pt-linha
     vem mais abaixo no arquivo e, com o mesmo peso, ganhava o gap e o
     padding (visto no print: bags a 8px da placa, fundo colado no texto). */
  /* 15/09/2026: mais apertada a pedido do Tiago (era 10px em cima e em
     baixo). Em cima fica 8px porque o selo sobe 8px acima da placa — com
     menos, ele sairia da linha e da faixa azul do marcado. */
  .pt-linha.destino-linha{flex-wrap:nowrap; cursor:pointer; gap:12px; padding:8px 8px 3px}
  .destino-linha.sel{background:var(--accent-light); border-radius:10px}
  /* A info estica ate a borda: bags ficam coladas na placa e a hora vai
     pra ponta direita (margin-left:auto). Voo que ja decolou: os icones
     ficam antes da hora, na cor do icone de mala (--text) em vez do
     amarelo — .ico-decolando tem cor propria, por isso o seletor longo. */
  .destino-info{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px;
    font-size:15px; color:var(--muted)}
  .destino-hora{margin-left:auto; display:inline-flex; align-items:center; gap:4px; flex:none}
  .destino-linha .voo-partiu, .destino-linha .voo-partiu .ico{color:var(--text)}
  .destino-bags{display:inline-flex; align-items:center; gap:2px;
    font-weight:600; color:var(--text)}
  /* Na viagem em andamento o chip fica FORA do bloco que estica, colado
     no check: dentro dele, a 360px, ele caia pra segunda linha e o
     cartao virava dois andares (visto na vitrine, 16/09/2026). Aqui ele
     tem lugar fixo, e os numeros dos cartoes alinham em coluna. */
  .viagem-bags{flex:0 0 auto; margin-right:10px; white-space:nowrap}

  /* Linha da esteira no passo EST (15/09/2026): mesmo formato das linhas de
     voo — voo que chegou · BAGs p/ BSB · EST [n]. O numero da esteira fica
     num quadrado azul de 34px com letra branca (pedido do Tiago). O -10px
     de cima cancela o respiro do .passo-cab, como .passo-secao faz; logo,
     a secao "CONEXOES" que vem depois nao precisa cancelar de novo. */
  .esteira-lista{margin:-10px 0 4px}
  .esteira-lista + .passo-secao{margin-top:0}
  .esteira-info{flex:1 1 auto; display:flex; align-items:center; gap:10px;
    font-size:15px; font-weight:700; color:var(--text)}
  .esteira-est{margin-left:auto; display:inline-flex; align-items:center; gap:6px}
  /* Mesmo "EST [n]" no fim de cada voo MARCADO no passo EST: diz para qual
     esteira aquele voo vai (15/09/2026). Fica depois da hora. */
  .destino-est{flex:none; display:inline-flex; align-items:center; gap:4px;
    font-size:15px; font-weight:700; color:var(--text)}
  .esteira-quad{display:inline-flex; align-items:center; justify-content:center;
    min-width:34px; height:34px; padding:0 6px; border-radius:6px;
    background:var(--amber); color:#fff; font-size:18px; font-weight:700}

  /* ---------- grade de voos (operador) ---------- */
  .voo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .voo-btn{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; cursor:pointer}

  .voo-btn .bx{font-size:13px; color:var(--muted); margin-top:2px}
  /* fundo claro do "selecionado" (era um dourado escurecido, pensado
     pra fundo escuro) — no fundo claro vira o chip --accent-light, com
     texto em --text pra fechar o contraste (--amber sobre sky-blue
     nao fecha 4.5:1 em corpo pequeno, --text fecha). */
  .voo-btn.sel{border-color:var(--amber); background:var(--accent-light); box-shadow:0 0 0 2px var(--amber) inset; opacity:1}
  .voo-btn.off{opacity:.4}
  .voo-btn.sel .ord{position:absolute}
  .badge{display:inline-flex; align-items:center; justify-content:center; min-width:44px; height:44px;
    padding:4px 8px; background:var(--surface); border:2px solid var(--amber); border-radius:6px;
    font-weight:400; font-size:22px; color:var(--amber)}
  .badge.sm{min-width:34px; height:32px; font-size:17px; border-radius:6px}

  /* CONTAGEM (quantos voos marcados) — circulo escuro (--text), numero
     branco. Nao e placa de box: placa tem borda --amber e diz ONDE; o
     circulo diz QUANTOS. Formas diferentes para nao se lerem como a
     mesma coisa na mesma linha. */
  .cont{display:inline-flex; align-items:center; justify-content:center;
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    background:var(--text); color:#fff; font-weight:600; font-size:17px; line-height:1}
  .dcode{font-weight:600; font-size:21px; color:var(--text)}
  .dhora{font-weight:500; font-size:15px; color:var(--muted); margin-top:6px}
  .linha-c{display:flex; align-items:center; gap:9px; justify-content:center; flex-wrap:wrap}
  .origem-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .origem-grid button{min-height:84px; font-size:24px}
  /* Na tela de base as duas perguntas ficam LADO A LADO, entao sem
     marca visivel nao da para saber o que ja foi respondido. O .sel
     de cima so vale para .voo-btn — este e o equivalente aqui. */
  .origem-grid button.sel{border-color:var(--amber); background:var(--accent-light);
    color:var(--text); box-shadow:0 0 0 2px var(--amber) inset}
  .origem-grid button.sel .badge{background:var(--amber); color:#fff; border-color:var(--amber)}

  /* ---------- tabelas (CCO) ---------- */
  table{width:100%; border-collapse:collapse; font-size:15px}
  th{text-transform:uppercase; letter-spacing:.08em; font-weight:600;
    color:var(--muted); text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); font-size:14px}
  td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
  td input{min-height:40px; font-size:15px; padding:4px 8px}
  td .mono{color:var(--amber); font-weight:600}
  .tbl-wrap{overflow-x:auto}

  /* Navegacao entre abas mora no SideMenu — ver "menu lateral (navegacao)"
     mais abaixo (.modal-bg.menu, .menu-lista, .menu-item). */

  /* ---------- login ---------- */
  .login{max-width:380px; margin:10vh auto; padding:0 16px}
  .login h1{font-size:40px; color:var(--amber); text-align:center}
  .login p.sub{text-align:center; color:var(--muted); margin-top:2px; letter-spacing:.14em; text-transform:uppercase; font-size:12px}
  .err{color:var(--red); font-size:14px; margin-top:8px; min-height:18px}
  .note{font-size:13px; color:var(--muted)}
  .list-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  /* Card de alerta: linha mais compacta, pra otimizar espaco (pedido do
     Tiago, 28/08) — a divisao entre voos (border-bottom, herdado de
     .list-line acima) fica mais colada, sem o respiro padrao das outras
     listas do app. Escopado a .alerta-lista pra nao mexer em telas fora
     do alerta. */
  .alerta-lista .list-line{padding:6px 0}
  .list-line:last-child{border-bottom:none}
  .grow{flex:1}
  .hide{display:none}
  .setup{max-width:560px; margin:8vh auto; padding:16px}

  /* ---------- modal generico ---------- */
  /* .16s aqui tem que bater com DURACAO_SAIDA em src/ui/components/modal.js —
     mudou um lado, muda o outro. */
  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
    align-items:center; justify-content:center; padding:16px;
    opacity:0; transition:opacity .16s ease}
  .modal-bg.show{opacity:1}
  /* Sem .show o overlay ou esta entrando (a classe entra no quadro seguinte)
     ou esta saindo — e na saida ele fica 160ms no DOM, invisivel mas ainda
     engolindo toque. No patio, confirmar e ja tocar no botao de baixo e
     gesto normal; sem esta regra esse segundo toque some. */
  .modal-bg:not(.show){pointer-events:none}
  .modal-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;
    max-width:440px; width:100%; max-height:80vh; overflow-y:auto;
    transform:translateY(8px) scale(.98); opacity:0; transition:transform .16s ease, opacity .16s ease}
  .modal-bg.show .modal-box{transform:translateY(0) scale(1); opacity:1}
  .modal-box h3{color:var(--amber); margin-bottom:10px}
  @media (prefers-reduced-motion: reduce){
    .modal-bg, .modal-box{transition:none}
  }

  /* ---------- folha sobreposta (fluxo do operador) ----------
     Mesmo #modal-bg do modal generico, so que colada embaixo e quase
     do tamanho da tela. Vale so para a folha: os outros ~30 popups do
     app seguem centralizados.

     Nenhuma regra de transition aqui de proposito — a folha continua
     sendo .modal-box, entao herda os .16s de cima E o corte do
     prefers-reduced-motion logo acima. Declarar transition aqui
     passaria por cima daquele corte sem ninguem perceber. */
  .modal-bg.folha{align-items:flex-end; padding:0}
  /* Altura FIXA, nao maxima: assim a cabeca e a trilha ficam sempre no
     mesmo lugar da tela, e o degrau que o operador quer tocar nao pula
     de posicao a cada resposta. overflow visivel porque o X mora FORA
     da folha; quem rola e o corpo, logo abaixo. */
  .modal-bg.folha .modal-box{width:100%; max-width:640px; position:relative;
    height:88vh; max-height:88vh;
    /* dvh desconta a barra do navegador do celular; nos aparelhos
       velhos da rampa ele e ignorado e vale o vh acima. Os 12% que
       sobram sao o lugar do X, que mora fora da folha. */
    height:88dvh; max-height:88dvh; overflow:visible;
    display:flex; flex-direction:column;
    border-radius:18px 18px 0 0; border-bottom:none;
    padding:8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%) scale(1)}
  .modal-bg.folha.show .modal-box{transform:translateY(0) scale(1)}

  /* ---------- painel da viagem (lateral) ----------
     Mesmo #modal-bg do modal generico, so que colado na borda direita
     e do tamanho da tela inteira — a viagem em andamento, sempre a
     mao, sem tirar o operador da base (alertas continuam atras, so
     escurecidos pelo overlay).

     Mesmo aviso da folha: nenhuma regra de transition aqui de proposito
     — o painel continua sendo .modal-box, entao herda os .16s da base
     E o corte de prefers-reduced-motion declarado mais acima. Declarar
     transition aqui passaria por cima daquele corte sem ninguem perceber. */
  .modal-bg.lado{align-items:stretch; justify-content:flex-end; padding:0}
  .modal-bg.lado .modal-box{width:88%; max-width:420px; height:100%; max-height:none;
    margin:0; border-radius:0; border:none; border-left:1px solid var(--line);
    /* Sombra pro lado de dentro, nao borda nos quatro lados: e o que
       faz o painel parecer flutuando sobre a pagina escurecida, em vez
       de uma caixa encostada torta na borda da tela. */
    box-shadow:-8px 0 24px rgba(0,0,0,.4);
    padding-right:calc(16px + env(safe-area-inset-right, 0px));
    transform:translateX(100%) scale(1)}
  .modal-bg.lado.show .modal-box{transform:translateX(0) scale(1)}

  /* ---------- menu lateral (navegacao) ----------
     Overlay PROPRIO (#menu-bg, ver menuLateral.js), nao o #modal-bg
     generico: o menu precisa poder ficar aberto ao mesmo tempo que a
     folha do Operador ou o painel da viagem (dois .modal-box deslizando
     ao mesmo tempo brigariam por z-index e toque-fora) — por isso abrir
     qualquer um dos outros fecha o menu antes. Mesma familia visual do
     painel da viagem (.lado), so entrando pela esquerda.

     Nenhuma regra de transition aqui de proposito, mesmo motivo da folha
     e do painel lateral: herda os .16s da base .modal-box E o corte de
     prefers-reduced-motion — declarar de novo aqui passaria por cima
     sem ninguem perceber. */
  .modal-bg.menu{align-items:stretch; justify-content:flex-start; padding:0}
  .modal-bg.menu .modal-box{width:82%; max-width:300px; height:100%; max-height:none;
    margin:0; border-radius:0; border:none; border-right:1px solid var(--line);
    box-shadow:8px 0 24px rgba(0,0,0,.4);
    padding:0; padding-left:env(safe-area-inset-left, 0px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    transform:translateX(-100%) scale(1)}
  .modal-bg.menu.show .modal-box{transform:translateX(0) scale(1)}
  .menu-lista{display:flex; flex-direction:column; padding:12px}
  .menu-item{text-align:left; margin-bottom:8px}
  .menu-item.on{background:var(--amber); color:#fff; border-color:var(--amber)}

  /* Alca: so sinaliza "isto subiu por cima". Nao arrasta — arrastar
     competiria com o rolar da lista de voos, que e o gesto que o
     operador mais faz aqui. */
  .folha-alca{flex:none; width:44px; height:5px; border-radius:999px;
    background:var(--line); margin:2px auto 8px}

  /* O X flutua no escuro ACIMA da folha: dentro dela ele disputava
     espaco com a trilha. 48px de alvo por causa da luva — com o toque
     fora travado, ele e o unico jeito de fechar. */
  .folha-x{position:absolute; top:-54px; right:10px; z-index:1;
    width:48px; height:48px; padding:0; border-radius:999px;
    font-size:20px; line-height:1;
    background:var(--bg); border:1px solid var(--line)}

  .folha-cabeca{flex:none}
  /* 15/09/2026: negrito e, quando e BAG, com o icone de mala (Tiago). */
  .folha-carga{font-size:18px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    letter-spacing:.12em; color:var(--muted)}

  /* Trilha: o que ja foi respondido, pequeno e tocavel. E o que
     substitui o Voltar — corrigir e tocar no degrau de novo, em vez de
     desfazer passo por passo. */
  .folha-trilha{flex:none; margin:6px 0 10px; padding-bottom:8px;
    border-bottom:1px solid var(--line)}
  .deg-linha{display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin-top:6px}
  .deg{flex:none; width:auto; min-height:38px; padding:0 12px;
    font-size:15px; border-radius:10px}
  .deg.on{border-color:var(--amber); background:var(--accent-light); color:var(--text)}
  /* Numero de carreta: estreito, senao a linha do equipamento nao cabe
     em 390px e o ultimo cai sozinho na linha de baixo. */
  .deg-n{min-width:38px; padding:0}
  .deg-x{color:var(--muted); font-size:15px}
  /* Quantidade marcada ao lado de PP/TCX/TLC na trilha (15/09/2026,
     Tiago): so o numero, menor, sem circulo, verde escuro (branco foi
     testado e sumia no azul-claro do marcado: 2:1). */
  .deg-qtd{font-size:12px; font-weight:700; color:var(--verde-escuro); margin-left:2px}
  /* Trilha da folha mais apertada (15/09/2026, Tiago): menos espaco
     entre os botoes e dos lados do texto, pra linha DESTINO (PP TCX TLC
     EST) caber numa linha so. Altura do toque (min-height 38px) nao muda. */
  .folha-trilha .deg-linha{gap:3px}
  .folha-trilha .deg{padding:0 6px}

  /* A pergunta do passo, grande: e a unica coisa que precisa ser lida
     de relance, sem parar o trator. */
  /* ---------- grade compacta de boxes (tela do operador) ----------
     O numero grande e o alvo; a informacao que o cartao largo trazia
     por escrito vira cor: faixa embaixo = estado da descarga, ponto no
     canto = bag em curso, numero no canto = quantos voos no box. */
  .bxq-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  /* .bxq tem overflow:hidden pra recortar os cantos da faixa de cor de
     baixo — um selo sobreposto a propria borda (como o do mockup) ficaria
     cortado ao meio se vivesse dentro dele. Por isso o selo (.bxq-corner)
     mora no wrapper, como IRMAO do quadrado, nao filho. */
  .bxq-wrap{position:relative; overflow:visible; cursor:pointer}
  .bxq{position:relative; overflow:hidden;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    min-height:64px; display:flex; align-items:center; justify-content:center}
  .bxq-num{font-weight:700;
    font-size:26px; letter-spacing:.04em; color:var(--text); line-height:1}
  .bxq-faixa{position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--line)}
  .bxq.bx-chegando .bxq-faixa{background:var(--amber-dim)}
  .bxq.bx-descarregando .bxq-faixa{background:var(--blue)}
  .bxq.bx-ok .bxq-faixa{background:var(--green)}
  .bxq.bx-ok .bxq-num{opacity:.62}
  .bxq.sel{border-color:var(--amber); background:var(--amber)}
  .bxq.sel .bxq-num{color:#fff; opacity:1}
  .bxq.sel .bxq-faixa{background:rgba(255,255,255,.3)}
  .bxq-pt{position:absolute; top:6px; right:6px; width:9px; height:9px;
    border-radius:50%; background:var(--orange)}
  /* desceu do canto superior esquerdo (top:3px) pro inferior: o selo de
     pouso novo tomou aquele canto. */
  .bxq-n{position:absolute; bottom:7px; left:6px;
    font-size:11px; font-weight:600; color:var(--muted)}
  .bxq.sel .bxq-n{color:#fff}
  /* minutos para o proximo pouso — canto oposto ao .bxq-n. Peso e
     contraste de .bxq-num (nao de .bxq-n): e informacao de decisao
     ("preciso correr?"), nao contagem secundaria. */
  .bxq-timer{position:absolute; bottom:7px; right:6px;
    font-size:11px; font-weight:700; color:var(--text)}
  .bxq.sel .bxq-timer{color:#fff}
  .bxq-legenda{margin-top:8px}
  /* selo de pouso no canto do quadrado — a grade compacta so mostra
     chegada (voosEmSolo), nunca saida, entao o icone e sempre "pousando"
     em todo tile. */
  .bxq-corner{position:absolute; top:-16px; left:-16px; width:32px; height:32px;
    border-radius:50%; border:2px solid #000; background:var(--verde-claro);
    display:flex; align-items:center; justify-content:center; color:#000;
    pointer-events:none; z-index:1}

  /* ---------- cabecalho de passo: acao no canto superior direito ----
     A acao saia embaixo, depois de uma grade de tamanho variavel — as
     vezes fora da vista, exigindo rolagem para terminar. */
  .passo-cab{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px}
  .passo-cab .passo-txt{flex:1 1 auto; min-width:0}
  .passo-canto{flex:0 0 auto; width:auto; min-height:56px; padding:8px 12px;
    font-size:15px; line-height:1.15; text-align:right; white-space:normal}
  /* .passo-sair: "Sair:" em cima, "1 destino" embaixo (15/09/2026). Numa
     linha so foi testado: o botao ia a 175px e espremia o titulo em duas
     linhas e a nota em tres. Quebrado, fica estreito como antes. */
  /* Nota logo embaixo do titulo do passo, colada nele (15/09/2026, Tiago:
     "no limite da linha de QUAIS VOOS?"). Antes: 10px de margem do titulo. */
  .passo-cab .folha-pergunta{margin-bottom:0}
  .passo-nota{margin:0}
  /* Rotulo de secao logo abaixo do cabecalho do passo ("CONEXOES DO ..."),
     colado na nota de cima (15/09/2026). O -10px cancela o margin-bottom
     do .passo-cab — so fecha enquanto titulo+nota forem mais altos que o
     botao do canto (hoje 63px contra 56px). Era estilo escrito na tela. */
  .passo-secao{margin:-10px 0 0; text-transform:uppercase; letter-spacing:.08em}
  /* Box com mais de um voo: as opcoes aparecem AQUI, no mesmo canto do
     "Confirmar" de sempre — nao mais um popover grudado no quadrado do
     box (bug relatado pelo Tiago, 08/09: um popover preso a um
     elemento de ~85px estourava a tela em qualquer box das pontas da
     grade, mesmo depois de tentar encostar na borda). Bloco normal do
     fluxo do documento, sem posicionamento absoluto — nao tem conta de
     viewport pra fechar. */
  .passo-escolha{display:flex; flex-direction:column; gap:6px; min-width:170px}
  .passo-escolha button{min-height:44px; font-size:14px; padding:6px 10px}

  /* ---------- trilha com rotulo por etapa ----------
     Uma linha por pergunta ja respondida, com TODOS os botoes daquela
     etapa: o escolhido em destaque. E o que aposenta o Voltar. */
  .deg-rot{flex:0 0 68px; font-size:12px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .deg.atual{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset}


  .folha-pergunta{font-size:26px; line-height:1.1; margin:2px 0 10px;
    letter-spacing:.02em}

  /* So o corpo rola: cabeca, trilha e o X ficam parados. */
  .folha-corpo{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch}

  /* A barra de acao gruda acima da barra de abas na tela normal; dentro
     da folha ela gruda no fim do corpo, que e quem rola. O fundo solido
     e para a lista de voos nao passar por baixo dela. */
  .barra-acao{position:sticky; bottom:74px; margin-top:14px}

  /* Barra fixa do Operador — sobe pro topo, colada no cabecalho, no
     lugar do nav.tabs de baixo (decisao do Tiago, 27/08). Ordem: icone
     de esconder, relogio, Malha, Historico, Turno, +. Malha/Historico/
     Turno sao so-icone (28/08) — cresce igual (flex:1), so muda o que
     tem dentro; o relogio, o "+" e o icone de esconder tem largura
     propria. Entrada suave via @keyframes: dispara sozinho quando o
     elemento entra no DOM (render() recria a barra do zero a cada
     chamada), sem precisar de transition nem de segundo quadro. */
  .op-barra{position:sticky; top:var(--header-h); z-index:9; display:flex; gap:8px;
    padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line);
    min-height:var(--barra-h); animation:barraDesce .16s ease}
  .op-barra button{flex:1; min-height:36px; font-size:15px;
    display:inline-flex; align-items:center; justify-content:center}
  .op-barra-relogio{flex:0 0 auto; width:44px; padding:0}
  .op-barra-relogio.on{background:var(--amber); color:#fff; border-color:var(--amber)}
  .op-barra-mais{flex:0 0 auto; width:auto; padding:0 18px;
    background:var(--amber); border-color:var(--amber); color:#fff}
  @keyframes barraDesce{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){ .op-barra{animation:none} }

  /* Dropdown do relogio: flutua por cima do conteudo (nao empurra
     nada) e fecha so ao tocar fora — o backdrop transparente e quem
     captura esse toque. Entrada suave via @keyframes: dispara sozinho
     quando o elemento entra no DOM (uma transition precisaria de um
     segundo frame pra animar, que o innerHTML trocado de uma vez nao
     da). */
  .janela-backdrop{position:fixed; inset:0; z-index:8}
  .janela-drop{position:absolute; top:100%; left:12px; z-index:9; margin-top:4px;
    background:var(--surface2); border:1px solid var(--line); border-radius:12px;
    padding:12px; display:flex; gap:10px; flex-wrap:wrap; width:auto;
    animation:cairJanela .16s ease-out}
  .janela-drop .note{flex-basis:100%; margin:8px 0 0; font-size:12px}
  @keyframes cairJanela{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){ .janela-drop{animation:none} }

  /* Painel reduzido da viagem ativa: preso logo abaixo da .op-barra
     (as duas sticky, uma embaixo da outra), alinhado a direita, sempre
     visivel enquanto ha viagem em andamento. Mesmo azul do chip
     "A caminho" (st-a_caminho) usado no resto do app — bate com o
     mesmo estado em qualquer outra tela, sem precisar de cor nova. */
  .op-viagem-reduzido{position:sticky; top:calc(var(--header-h) + var(--barra-h));
    z-index:6; margin:10px 0 10px auto;
    display:flex; align-items:center; gap:8px; width:fit-content; min-height:56px;
    background:var(--surface2); border:2px solid var(--blue); color:var(--blue);
    border-radius:999px; padding:8px 16px}
  .op-paradas{display:flex; gap:4px}

  /* Timer da linha do alerta: quanto falta pro voo de destino sair.
     Escala pedida pelo Tiago (27/08) — 40min ainda da folga (azul),
     25min aperta (laranja), 15min e hora de ir (amarelo); abaixo
     disso (ou ja partido) e o mesmo vermelho do "MAIS URGENTE".
     "amarelo" usa --amber-mid, nao --amber: desde 30/08/2026 --amber e
     a cor de marca (um azul), e a escala de 4 cores do timer precisa
     continuar subindo folga->critico sem se confundir com botao. */
  .op-timer{font-weight:700; font-size:.85em}
  .op-timer.timer-azul{color:var(--blue)}
  .op-timer.timer-laranja{color:var(--orange)}
  .op-timer.timer-amarelo{color:var(--amber-mid)}
  .op-timer.timer-vermelho{color:var(--red)}
  /* Dentro da folha o corpo tem altura fixa: sem o margin-top:auto a
     barra ficaria boiando no meio quando a lista e curta, e com a
     lista longa ela continua grudada embaixo pelo sticky. */
  .modal-bg.folha .folha-corpo{display:flex; flex-direction:column}
  .modal-bg.folha .barra-acao{margin-top:auto; bottom:0; padding-bottom:6px;
    background:var(--surface)}
  .pt-linha{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .pt-linha:last-child{border-bottom:none}

  /* Carretas do Ponto Delta (lider): cada balde (automatico por RCT ou
     criado a mao) e um grupo visualmente separado dos vizinhos, senao as
     linhas de baldes diferentes se misturam numa lista so. */
  .balde-delta{margin-top:10px; padding-top:6px; border-top:1px solid var(--line)}
  .balde-delta:first-child{margin-top:0; padding-top:0; border-top:none}
  .balde-delta input[type="number"]{min-height:34px; font-size:14px}

  .pt-check{cursor:pointer; flex-shrink:0; display:inline-flex}

  /* ---------- Ponto Delta do lider: largura de celular (15/09/2026) ----------
     Pedido do Tiago a partir da vitrine: a janela rolava pro lado (58-94px),
     "+carreta vazia" e o Confirmar da barra saiam cortados, e cada conexao
     quebrava em duas linhas. Tudo escopado em .delta-popup. */
  /* Cabecalho preso no topo da janela ao rolar (15/09/2026, Tiago): titulo,
     botoes e ALOCAR VOOS EM. O margin negativo cancela o padding de 16px do
     .modal-box pra encostar na borda de cima e cobrir a largura toda; o fundo
     solido e pra carreta nao aparecer por baixo quando rola. */
  .delta-cabeca{position:sticky; top:-16px; z-index:2; background:var(--surface);
    margin:-16px -16px 8px; padding:4px 16px 0; border-bottom:1px solid var(--line)}
  .delta-cabeca .barra-mover-delta{position:static; border-bottom:none; margin-bottom:0; padding:4px 0 6px}
  .delta-popup .delta-topo{border:none; padding:0; gap:6px}
  /* A palavra "Delta" vira etiqueta pequena (17/09/2026). Medido a 360px:
     com ela no corpo do h3 (18.7px) o cabecalho pedia ~288px e so havia
     281 — o prefixo caia sozinho pra linha de baixo. A 13px cabe tudo
     numa linha. Nao e so pra caber: quem manda no cabecalho e o VOO
     (24px) com o box e o prefixo; "Delta" e rotulo de secao, nao o dado.
     O .voo e o .delta-prefixo tem font-size proprio e nao encolhem com
     isto. Se o titulo voltar a quebrar, a saida e tirar a palavra: sem
     ela cabe com sobra, no corpo cheio. */
  .delta-popup .delta-topo h3{margin:0; min-width:0; font-size:13px}
  /* Prefixo da aeronave. Comecou em 19.7px (o corpo do "YYY": 24px do
     .voo x .82em do .voo-apt), mas ai o cabecalho ficava com 3px de
     sobra a 360px -- qualquer fonte diferente quebrava a linha. O Tiago
     escolheu manter a palavra DELTA e encolher o prefixo (17/09/2026).
     Medido na vitrine a 360px, com DELTA em 13px:
       19.7px -> 3px de sobra    16px -> 16px    15px -> 20px
     16px fica: da folga de verdade e continua bem maior que os 13px de
     .note, que era o tamanho antigo.
     Em px e nao em em porque aqui ele e IRMAO do .voo, nao filho -- em
     resolveria contra o h3. Mesmo padrao do .destino-viagem .voo-box.
     Cor de nota (--muted): mesmo peso visual de referencia, pra nao
     competir com o numero do voo. Sem letter-spacing (ajuste-visual). */
  .delta-prefixo{font-size:16px; line-height:1; white-space:nowrap}
  /* Botoes do topo numa linha propria (17/09/2026, Tiago): na mesma
     linha do titulo eles empurravam o prefixo pra baixo sozinho, e o
     cabecalho quebrava do jeito errado. */
  /* wrap (17/09/2026): Equipamentos + Descarrega OK + Nova carreta juntos
     passam de 400px, e o cabecalho a 360px so tem ~280px pra botao (o
     resto e a placa/prefixo do titulo, acima). Sem wrap o texto cortava
     na borda em vez de quebrar linha -- pior que ocupar duas linhas. */
  .delta-acoes{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:6px}
  /* Equipamentos: botao de texto (nao icone) -- e a unica acao do
     cabecalho que abre uma tela inteira, e "Equipamentos" escrito nao
     se confunde com os reboques dos vizinhos. */
  .equip-botao{width:auto; padding:0 12px; flex:none; font-size:15px}
  /* Os cinco pedidos: dois por linha a 360px, alvo cheio de 56px. Nao
     sao button.small de proposito -- pedir equipamento errado da
     trabalho pra desfazer, entao o alvo e o grande. */
  .equip-grid{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px}
  .equip-pedir{flex:1 1 calc(50% - 8px); width:auto; min-height:56px}
  .equip-pe{margin-top:12px}
  /* Resumo da carreta (N ampulheta · N mao). Saiu de um style="" inline
     (17/09/2026) — a skill ajuste-visual manda tirar o estilo de dentro
     da tela quando se mexe nela, senao o CSS nao consegue ganhar dele.
     O numero e o icone andam colados: sao uma informacao so. */
  .carreta-resumo{display:inline-flex; align-items:center; gap:4px; margin-left:6px; white-space:nowrap}
  .carreta-resumo > span{display:inline-flex; align-items:center; gap:1px}
  .carreta-resumo .ico{opacity:.8; margin-right:0}
  /* Botoes da tela com 35px de altura e icones com 34px (15/09/2026, Tiago).
     Vale pra todo botao pequeno do popup (topo, carreta, check, barra); os
     botoes grandes do pe (Atualizar/Fechar, Descarrega OK) nao entram.
     button.small no seletor: senao button.small{min-height:42px} ganha. */
  .delta-popup button.small{min-height:35px; height:35px}
  .delta-popup button.small .ico{width:34px; height:34px; margin-right:0}
  .delta-icone{width:auto; padding:0 4px; display:inline-flex; align-items:center; gap:0;
    font-size:20px; font-weight:700; flex:none}
  .delta-n{font-size:14px; font-weight:700; margin-left:2px}
  /* carreta = accordion. A faixa de cor vem da matiz (--matiz) de cada uma */
  .balde-cor{border-left:3px solid hsl(var(--matiz) 55% 45%); background:hsl(var(--matiz) 55% 45% / .1);
    border-radius:0 8px 8px 0; padding-left:6px}
  .balde-cabeca{border:none; padding:4px 0; gap:6px}
  .balde-alterna{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; cursor:pointer}
  .balde-cor .acordeon-seta{transition:transform .16s ease}
  .balde-cor.aberto .acordeon-seta{transform:rotate(90deg)}
  .balde-cor:not(.aberto) .balde-corpo{display:none}
  @media (prefers-reduced-motion: reduce){ .balde-cor .acordeon-seta{transition:none} }
  /* "BAGs p/ BASE": o unico balde que nunca tem lista dentro (a
     bag da base nao vem no arquivo). Borda tracejada pra dizer isso de
     relance -- nao e uma carreta que o sistema conhece, e um botao de
     chamar com nome. Sem acordeao: nao ha o que abrir. */
  .balde-base{border-left-style:dashed}
  .balde-base-nota{margin:0 0 6px; font-size:12px}
  /* Um alerta da base por linha, dentro do balde: hora + estado + botoes */
  .alerta-base{align-items:center; gap:4px; padding:4px 0}
  .alerta-base .delta-n{margin-left:2px}

  /* CARGA do Ponto Indice (lider). Tres estados no MESMO botao: livre
     (chama), aguardando (cancela) e a caminho (desabilitado, com o trator
     andando). O trator so anda se a pessoa aceita movimento -- consultado
     ao vivo pelo navegador, entao vale mesmo se ela mudar com o app aberto. */
  button.carga-botao{width:auto; display:inline-flex; align-items:center; gap:6px; font-weight:700}
  button.carga-botao .ico{margin-right:0}
  button.carga-botao.a-caminho{color:var(--green); border-color:var(--green); opacity:1}
  button.carga-botao.chamada{color:var(--blue)}
  @media (prefers-reduced-motion: no-preference){
    .carga-botao.a-caminho .ico{animation:cargaAnda 1.1s ease-in-out infinite alternate}
  }
  @keyframes cargaAnda{from{transform:translateX(-3px)} to{transform:translateX(5px)}}

  /* Secao CARGA dentro do card BOX do operador */
  .carga-secao{margin-top:8px; padding-top:6px; border-top:1px dashed var(--line)}
  .carga-titulo{margin:0 0 4px; font-weight:700; letter-spacing:.06em; color:var(--amber)}
  .carga-hora{display:inline-flex; align-items:center; gap:3px; margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums}
  /* conexao numa linha so: nada desce pra linha de baixo */
  .balde-delta .pt-linha{flex-wrap:nowrap; gap:4px; padding:6px 0}
  .balde-delta .pt-linha .voo{font-size:20px}
  .balde-delta .chip{font-size:11px; padding:1px 6px; letter-spacing:0; flex:none}
  .delta-status{display:inline-flex; flex:none}
  .delta-status.solicitado{color:var(--blue)}
  .delta-status.pega{color:var(--green)}
  .delta-qtd{flex:none; font-weight:700; color:var(--amber)}
  .delta-manual{width:40px; min-height:35px; height:35px; padding:2px 4px; font-size:15px; text-align:center; flex:none}
  /* button.delta-ok, nao so .delta-ok: button.small (width:auto) tinha mais
     peso e deixava o check com 20px, passando da borda (medido na vitrine). */
  button.delta-ok{width:35px; min-height:35px; height:35px; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center}
  .delta-ok .ico{margin-right:0}
  .delta-manual-grupo{display:inline-flex; align-items:center; gap:4px; flex:none}

  /* ---------- Ponto Indice do lider, no formato do Delta (21/09/2026) ----------
     Pedido do Tiago: mesma formatacao do Delta, botoes do mesmo tamanho, sem
     RCT, cabecalho fixo (.delta-cabeca, reaproveitado) e so a lista rolando.
     A classe .delta-popup no envelope e o que iguala os botoes a 35px.
     Cada linha tem duas metades: .india-id (voo + avisos) e .india-ctl (P R D,
     campo, botoes). Se nao couberem lado a lado a 360px, a de controles desce
     INTEIRA -- o que nao pode acontecer e um botao quebrar sozinho. */
  .india-lista .pt-linha{flex-wrap:wrap; gap:4px 6px; padding:6px 0}
  .india-id{flex:1 1 auto; min-width:0; display:flex; align-items:center; flex-wrap:wrap; gap:4px}
  .india-ctl{flex:none; margin-left:auto; display:flex; align-items:center; gap:4px}
  .india-lista .voo{font-size:20px}
  .india-lista .chip{font-size:11px; padding:1px 6px; letter-spacing:0; flex:none}
  .india-entregue{color:#1f1f1f}
  .india-trazendo{color:var(--green); margin-left:2px}
  .india-coletado{color:var(--blue)}
  button.india-cancelar{color:var(--red)}
  button.india-desfazer, button.india-substituir{width:auto; padding:0 10px; flex:none}
  button.india-substituir{margin-bottom:8px}
  .india-rodape, .india-rodape-botao{margin-top:12px}
  /* P R D: uma coluna por letra, cor por significado (nao por espaco) */
  .prd{display:flex; gap:8px; align-items:flex-end}
  .prd-col{text-align:center; line-height:1.15}
  .prd-letra{font-size:11px; font-weight:700}
  .prd-p{color:var(--green)}
  .prd-r{color:var(--blue)}
  .prd-d.falta{color:var(--red)}
  .prd-d.sobra{color:var(--amber)}
  .prd-d.zero{color:var(--muted)}
  .prd-ajuste{font-size:10px; color:var(--amber)}
  .prd-legenda{margin:4px 0 10px}
  /* Diferenca entre o que o lider CONTOU e o que o arquivo previa
     (sql/atualizacao_46.sql). Aparece ao vivo enquanto ele digita: e o
     que mostra na hora que "3" num voo de 5 previstas quer dizer -2, em
     vez de deixar o engano ser descoberto do outro lado do patio.
     Some quando a conta bate -- linha sem selo = contado e confere. */
  .delta-dif{flex:none; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    padding:1px 4px; border-radius:6px; white-space:nowrap}
  .delta-dif.falta{color:#fff; background:var(--red)}
  .delta-dif.sobra{color:#fff; background:var(--orange)}
  /* marcar = tocar na linha (sem quadradinho), fundo de selecionado igual a
     folha da viagem nova; o padding lateral e o mesmo marcada ou nao, pra
     linha nao pular de lugar ao marcar */
  .delta-conexao{cursor:pointer; padding-left:4px; padding-right:4px; border-radius:8px}
  /* DUAS PERNAS (16/09/2026): mesmo voo de saida em duas conexoes, com
     destinos diferentes — a mesma aeronave faz os dois trechos, e as duas
     linhas tem que ir na MESMA carreta. Roxo de proposito: e o unico tom
     sem significado ja atribuido no app (azul = solicitado, verde = pego,
     ambar = selecionado/urgente, vermelho = atraso). Uma cor so pra todos
     os pares — ver ehDuasPernasDelta em telaPontos.js.
     Marcar a linha PINTA POR CIMA (3 classes ganham de 2): saber o que
     esta selecionado importa mais, no momento do toque, do que lembrar
     que aquele voo tem duas pernas. */
  .pt-linha.duas-pernas{background:var(--duas-pernas); border-radius:8px}
  .delta-conexao.sel, .delta-conexao.duas-pernas.sel{background:var(--accent-light)}
  /* "ALOCAR EM:" + lista do tamanho do nome da carreta (nao estica) */
  /* 12px e gap 6: "ALOCAR VOOS EM:" a 14px + lista + check passava 4px da
     janela a 360px (medido). A lista pode ENCOLHER (flex 0 1) se o nome da
     carreta for comprido, pra nao voltar a rolar pro lado. */
  .delta-alocar{font-size:12px; font-weight:700; color:var(--text); flex:none}
  .delta-cabeca .barra-mover-delta{gap:6px}
  .barra-mover-delta .delta-alvo{flex:0 1 auto; width:auto; min-width:80px; min-height:35px; height:35px;
    padding:2px 6px; font-size:15px}

  /* Barra "ALOCAR EM:" do Ponto Delta -- so aparece com 1+
     marcado (ver barraMoverSelecionadosDelta, telaPontos.js). Fixa no
     topo do popup enquanto rola a lista de baldes, senao marcar uma
     linha mais embaixo perde o Confirmar de vista. */
  .barra-mover-delta{position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px;
    background:var(--surface); padding:8px 0; margin-bottom:4px; border-bottom:1px solid var(--line)}

  /* ---------- alerta piscando (bag solicitada) ---------- */
  @keyframes blinkbox{0%,100%{opacity:1} 50%{opacity:.25}}
  .blink{animation:blinkbox 1s infinite}

  /* ---------- sino balancando (urgencia no cabecalho do cartao) ---------- */
  @keyframes sinoBalanca{
    0%,100%{transform:rotate(0)}
    10%,90%{transform:rotate(2deg)}
    20%,40%,60%{transform:rotate(-6deg)}
    30%,50%,70%{transform:rotate(6deg)}
    80%{transform:rotate(-2deg)}
  }

  /* ---------- anel girando (spinner de importacao dos Pontos) ---------- */
  @keyframes girar{from{transform:rotate(0)} to{transform:rotate(360deg)}}

  /* ---------- tela inicial (ferramentas liberadas) ---------- */
  .home h2{font-size:26px; color:var(--amber)}
  .home p.sub{color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:12px; margin:2px 0 16px}
  .grade-ferramentas{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
  .cartao-ferramenta{display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    min-height:84px; text-align:left; padding:12px 14px}
  .cf-nome{font-size:19px; color:var(--amber); letter-spacing:.06em}
  .cf-desc{text-transform:none; letter-spacing:0;
    font-size:13px; font-weight:400; color:var(--muted); line-height:1.25}

  /* ---------- painel de acessos ---------- */
  .ua-topo{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .ua-chips{display:flex; flex-wrap:wrap; gap:8px}
  .ua-chips button{width:auto; min-height:38px; font-size:15px; padding:4px 14px; border-radius:999px}
  .chip-padrao{background:var(--surface2); color:var(--muted); border-color:var(--line); cursor:default}
  .chip-extra{background:var(--amber); color:#fff; border-color:var(--amber)}
  .chip-off{background:transparent; color:var(--muted); border-color:var(--line)}
  .modal-acoes{display:flex; gap:10px; margin-top:14px}
  .modal-acoes button{flex:1}

  /* ---------- skeleton de carregamento (telaPermissoes) ---------- */
  @keyframes skeletonPulse{0%,100%{opacity:.35} 50%{opacity:.7}}
  .skeleton{background:var(--surface2); border-radius:8px; animation:skeletonPulse 1.1s ease-in-out infinite}
  .skeleton-line{height:14px; margin:6px 0; border-radius:4px}
  @media (prefers-reduced-motion: reduce){ .skeleton{ animation:none; opacity:.5 } }

  /* ---------- barra de carga (progresso REAL, ui/components/skeleton.js) ----------
     A largura da barra vem de UI.carga: quantas consultas ja voltaram
     do servidor. NAO ha animacao de avanco de proposito -- barra que
     anda sozinha promete um progresso que ninguem mediu. So a transicao
     entre um passo e o seguinte e suavizada, e ela some com
     prefers-reduced-motion. */
  .carga{display:flex; flex-direction:column; gap:8px; padding:18px 4px; max-width:420px; margin:0 auto}
  .carga-rotulo{font-size:15px; font-weight:700; color:var(--text); text-align:center}
  .carga-trilho{height:10px; border-radius:5px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
  .carga-barra{height:100%; width:0; background:var(--amber); transition:width .25s ease}
  .carga-txt{font-size:13px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){ .carga-barra{ transition:none } }

  /* ---------- PATIO: mapa da coordenacao (telaPatio.js) ----------
     Unica tela que usa a largura toda: o mapa e o conteudo. No celular
     o mapa vem em cima e a lista embaixo, com a pagina rolando; no
     computador os dois dividem a altura da janela. */
  main.largo{max-width:none; padding:0}
  .patio{--cinza:#7F8E97; display:flex; flex-direction:column; height:calc(100vh - var(--header-h))}
  .patio button{width:auto; min-height:40px; padding:0 12px; font-size:13px; border-radius:8px; letter-spacing:.05em}
  .patio-topo{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line)}
  .patio-par{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .patio-par button{border:0; border-radius:0; background:var(--surface2)}
  .patio-par button+button{border-left:1px solid var(--line)}
  .patio button[aria-pressed="true"]{background:var(--amber); color:#fff; border-color:var(--amber)}
  .patio-relogio{margin-left:auto; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
  .patio-demo-aviso{background:var(--red); color:#fff; font-weight:700; font-size:13px; padding:8px 12px; text-align:center}
  .patio-kpis{display:flex; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--line)}
  .patio-kpi{padding:6px 14px 7px; border-right:1px solid var(--line); min-width:max-content}
  .patio-kpi b{display:block; font-size:20px; line-height:1.15; font-variant-numeric:tabular-nums}
  .patio-kpi em{font-style:normal; font-size:11px; color:var(--muted); margin-left:4px}
  .patio-kpi span{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .patio-kpi.atencao b{color:var(--orange)} .patio-kpi.ruim b{color:var(--red)}

  .patio-corpo{display:grid; grid-template-columns:minmax(0,1fr) 380px; flex:1; min-height:0}
  .patio-mapa-wrap{position:relative; min-height:0; overflow:hidden; background:#E6E9E3}
  /* So o MAPA espera. O topo (dados reais/demonstracao, relogio) e os
     numeros do turno ja estao na tela enquanto isto aparece. */
  .patio-carregando{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px}
  #patio-mapa{display:block; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none}
  #patio-mapa text{font-family:'SUSE Mono',monospace; pointer-events:none}
  .patio-camadas{position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none}
  .patio-camadas button{pointer-events:auto; min-height:34px; border-radius:17px; background:rgba(255,255,255,.93); font-size:11px}
  .patio-camadas button[aria-pressed="false"]{color:var(--muted); text-decoration:line-through}
  .patio-zoom{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px}
  .patio-zoom button{width:44px; min-height:44px; padding:0; font-size:20px; background:var(--surface)}
  .patio-canto{position:absolute; left:8px; bottom:8px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:calc(100% - 70px)}
  .patio-regua{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px}
  .patio-regua i{display:block; height:6px; border:2px solid var(--text); border-top:0}
  .patio-legenda{background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:10px; font-size:12px; max-width:290px}
  .patio-legenda summary{cursor:pointer; padding:8px 10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:11px}
  .patio-legenda .leg{padding:0 10px 10px; display:grid; grid-template-columns:20px 1fr; gap:5px 8px; align-items:center}
  .patio-legenda h4{grid-column:1/-1; margin:6px 0 0; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
  .patio-legenda .sw{display:block; width:18px; height:13px; border-radius:3px}

  .patio-rail{background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .patio-abas{display:flex; border-bottom:1px solid var(--line); overflow-x:auto}
  /* Cinco abas em 380px (e em 360 no celular): cada uma segura o proprio
     tamanho e a faixa rola de lado em vez de espremer o rotulo. */
  .patio .patio-abas button{flex:1 0 auto; min-width:74px}
  /* A aba "Bags" e a tela da coordenacao inteira (telaViagensCCO) dentro
     do trilho: cartao e titulo precisam de margem menor aqui. */
  .patio-lista .card{margin:8px 10px; padding:10px}
  .patio-lista .board-title{margin:12px 10px 6px}
  .patio-lista .board-title h2{font-size:14px}
  /* O trilho tem 380px: a linha do cartao quebra em vez de empurrar o
     chip para fora da tela. */
  .patio-lista .list-line{flex-wrap:wrap; gap:4px 8px}
  .patio-lista .chip{font-size:11px; white-space:normal}
  .patio-lista .voo{flex-wrap:wrap}
  .patio .patio-abas button{flex:1; min-height:46px; border:0; border-radius:0; background:none; color:var(--muted); font-size:12px; border-bottom:3px solid transparent}
  .patio .patio-abas button[aria-selected="true"]{color:var(--text); border-bottom-color:var(--amber)}
  .patio-abas .n{background:var(--red); color:#fff; border-radius:9px; padding:1px 6px; margin-left:4px; font-size:11px}
  .patio-lista{flex:1; overflow-y:auto; min-height:0}
  .patio-nota{margin:0; padding:9px 12px; font-size:11px; color:var(--muted); border-top:1px solid var(--line)}
  .patio-aviso{margin:10px 12px; padding:9px 11px; border-radius:8px; background:var(--surface2); border:1px solid var(--line); font-size:13px; line-height:1.45}
  /* Dentro de uma linha do cartao o aviso ja esta recuado pela linha: a
     margem de fora duplicaria o recuo e ele sairia desalinhado das
     outras linhas. */
  .patio-aviso.compacto{margin:0}

  .patio .patio-alerta{display:grid; grid-template-columns:auto 1fr auto; gap:3px 10px; align-items:baseline; width:100%; min-height:56px;
    text-align:left; text-transform:none; letter-spacing:0; border:0; border-bottom:1px solid var(--line); border-radius:0; background:none; padding:10px 12px}
  .patio-alerta .sev{font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:4px; color:#fff; align-self:center}
  .patio-alerta .sev.crit{background:var(--red)} .patio-alerta .sev.aperta{background:var(--orange)} .patio-alerta .sev.info{background:var(--blue)}
  .patio-alerta .onde{font-size:16px; font-weight:700}
  .patio-alerta .tempo{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
  .patio-alerta .tempo.crit{color:var(--red)} .patio-alerta .tempo.aperta{color:var(--orange)} .patio-alerta .tempo.info{color:var(--blue)}
